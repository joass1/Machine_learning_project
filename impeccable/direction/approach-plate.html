<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Approach Plate</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#eef0ed;--ink:#0f1113;--accent:#ff5a1f;--rule:#0f111333}
*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;background:var(--ground);color:var(--ink);font-family:'Martian Mono',monospace;position:relative;overflow:hidden}
.frame{position:absolute;inset:28px;border:1.5px solid var(--ink)}
.ticks-t,.ticks-b{position:absolute;left:28px;right:28px;height:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 16px)}
.ticks-t{top:18px}.ticks-b{bottom:18px}
h1{position:absolute;left:64px;top:74px;font:900 188px/.82 'Big Shoulders Display';text-transform:uppercase;letter-spacing:-.01em;width:700px}
h1 em{font-style:normal;color:var(--accent)}
.hero{position:absolute;right:64px;top:74px;width:400px;height:500px;background:#c9ccc6;border:1.5px solid var(--ink)}
.hero span{position:absolute;left:10px;bottom:8px;font-size:10px}
.plan{position:absolute;right:64px;top:74px;width:400px;height:500px}
.m{position:absolute;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.sub{position:absolute;left:68px;bottom:116px;font:500 15px/1.5 'Martian Mono';width:560px}
.foot{position:absolute;left:64px;right:64px;bottom:40px;border-top:1.5px solid var(--ink);padding-top:8px;font-size:10px;display:flex;justify-content:space-between}
</style></head><body><div class="frame"></div><div class="ticks-t"></div><div class="ticks-b"></div>
<h1>Cleared for <em>Satis&shy;faction</em></h1>
<div class="hero"><span>HERO SLOT 4:5 · HIGGSFIELD · PROCESSED (LINEWORK)</span></div>
<svg class="plan" viewBox="0 0 400 500" fill="none" stroke="#0f1113" stroke-width="1"><circle cx="200" cy="250" r="60"/><circle cx="200" cy="250" r="120" stroke-dasharray="3 5"/><circle cx="200" cy="250" r="180"/><path d="M200 20V480M20 250H380" stroke="#ff5a1f" stroke-width="1.5"/></svg>
<p class="sub">Can a synthetic copy of an airline survey be trusted for real decisions? 699,635 synthetic vs 129,880 real passengers.</p>
<div class="m" style="left:64px;top:46px">PLATE 03-01 · IS460 · GROUP 03</div>
<div class="m" style="right:64px;top:46px">RWY 03L · FINAL APPROACH</div>
</body></html>
