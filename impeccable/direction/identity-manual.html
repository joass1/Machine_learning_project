<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Identity Manual</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{--field:#0b4fd6;--paper:#f6f4ee;--sun:#ffc21a;--ink:#0a0a0a}
*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;background:var(--field);font-family:'Archivo',sans-serif;color:var(--paper);position:relative;overflow:hidden}
.disc{position:absolute;right:-120px;top:-90px;width:620px;height:620px;border-radius:50%;background:var(--sun)}
.disc i{position:absolute;left:150px;bottom:140px;font:700 11px 'Archivo';color:var(--ink);font-style:normal;letter-spacing:.06em}
h1{position:absolute;left:60px;bottom:140px;font:900 150px/.88 'Archivo';font-stretch:62%;text-transform:uppercase;letter-spacing:-.02em;width:900px}
.bar{position:absolute;left:0;right:0;bottom:0;height:64px;background:var(--paper);color:var(--ink);display:flex;align-items:center;padding:0 60px;font:600 13px 'Archivo';gap:40px}
.bar span:last-child{margin-left:auto}
.s{position:absolute;left:60px;top:48px;font:700 20px 'Archivo';letter-spacing:.02em;width:480px;line-height:1.25}
</style></head><body><div class="disc"><i>HERO SLOT 1:1 · HIGGSFIELD · GRAIN</i></div>
<p class="s">Predicting airline satisfaction: is the synthetic copy good enough?</p>
<h1>Cleared for Satisfaction</h1>
<div class="bar"><span>IS460 · Group 03</span><span></span><span>1</span></div>
</body></html>
