<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Runway Paint</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--asphalt:#25272a;--paint:#f4f4f0;--yellow:#f2c200}
*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;background:var(--asphalt);color:var(--paint);position:relative;overflow:hidden;font-family:'Chivo Mono',monospace}
.keys{position:absolute;left:64px;right:64px;top:44px;height:70px;background:repeating-linear-gradient(90deg,var(--paint) 0 26px,transparent 26px 52px)}
h1{position:absolute;left:60px;top:150px;font:800 232px/.8 'Barlow Condensed';text-transform:uppercase;letter-spacing:-.005em;width:1180px}
h1 span{color:var(--yellow)}
.centre{position:absolute;left:64px;right:64px;bottom:150px;height:10px;background:repeating-linear-gradient(90deg,var(--paint) 0 90px,transparent 90px 150px)}
.hero{position:absolute;left:64px;right:64px;bottom:34px;height:92px;background:#3b3f43}
.hero i{position:absolute;right:10px;bottom:6px;font:10px 'Chivo Mono';font-style:normal;color:#aaa}
.m{position:absolute;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#b4b7b9}
</style></head><body><div class="keys"></div>
<div class="m" style="right:64px;top:126px">03L · IS460 · GROUP 03</div>
<h1>Cleared for <span>Satisfaction</span></h1>
<div class="centre"></div><div class="hero"><i>HERO SLOT 1152:92 · HIGGSFIELD · GRAIN</i></div>
</body></html>
