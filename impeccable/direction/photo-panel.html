<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Photo Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--photo:#8c8a84;--panel:#f2f1ee;--ink:#141517}
*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;background:var(--photo);color:var(--ink);font-family:'Host Grotesk',sans-serif;position:relative;overflow:hidden}
.panel{position:absolute;left:0;top:0;width:520px;height:720px;background:var(--panel);padding:24px 40px}
.bar{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #14151755;padding-bottom:12px}
h1{position:absolute;left:40px;top:200px;font:400 64px/1.02 'Host Grotesk';letter-spacing:-.035em;width:430px}
.sub{position:absolute;left:40px;top:400px;font-size:17px;width:380px;letter-spacing:-.01em}
.meta{position:absolute;left:40px;bottom:28px;font-size:11px;line-height:1.5}
.slot{position:absolute;right:16px;bottom:12px;font-size:10px;color:#fffa}
</style></head><body>
<div class="panel"><div class="bar"><span>FINAL REPORT</span><span>2026</span></div><h1>Cleared for Satisfaction</h1><p class="sub">Can a synthetic airline survey be trusted for real decisions?</p><div class="meta">IS460 · Group 03 · SMU</div></div>
<div class="slot">PHOTO 760:720 · HIGGSFIELD · CABIN WINDOWS, RAKING LIGHT, CLOSE CROP</div>
</body></html>
