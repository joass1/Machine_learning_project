<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Annual Report</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;800;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
