<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Title Block</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--sheet:#f5f5f2;--ink:#0c0d0e;--red:#d63a1f}
*{box-sizing:border-box;margin:0}body{width:1280px;height:720px;background:var(--sheet);color:var(--ink);font-family:'Chivo Mono',monospace;position:relative;overflow:hidden}
.frame{position:absolute;inset:24px;border:4px solid var(--ink)}
h1{position:absolute;left:64px;top:60px;font:400 196px/.9 'Anton';text-transform:uppercase;width:1000px;letter-spacing:-.005em}
h1 u{text-decoration:none;color:var(--red)}
.hero{position:absolute;left:64px;top:470px;width:560px;height:150px;background:#c8cac6;border:2px solid var(--ink)}
.hero i{position:absolute;left:8px;bottom:5px;font:10px 'Chivo Mono';font-style:normal}
.tb{position:absolute;right:24px;bottom:24px;width:560px;height:150px;border-top:4px solid var(--ink);border-left:4px solid var(--ink);display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.tb div{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.tb b{display:block;font-size:17px;margin-top:6px;letter-spacing:0}
</style></head><body><div class="frame"></div>
<h1>Cleared for <u>Satisfaction</u></h1>
<div class="hero"><i>HERO SLOT 56:15 · HIGGSFIELD · LINEWORK</i></div>
<div class="tb"><div>Project<b>IS460</b></div><div>Group<b>03</b></div><div>Sheet<b>1 / 24</b></div><div style="grid-column:span 2">Subject<b>Synthetic vs real survey</b></div><div>Rev<b>FINAL</b></div></div>
</body></html>
