[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airsat"
version = "0.1.0"
description = "IS460 Group 03: synthetic fidelity and explainable drivers of airline passenger satisfaction"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "shap>=0.46",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
deep = ["torch>=2.4", "pytabkit>=1.5", "tabpfn>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs the real datasets on disk"]

[tool.coverage.run]
source = ["airsat"]
omit = ["*/plotstyle.py"]
